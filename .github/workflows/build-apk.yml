name: Build Klinik AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Klinik AI project
        run: |
          test -s KlinikAI_GitHub_Project_v0.3.zip
          unzip -oq KlinikAI_GitHub_Project_v0.3.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run offline logic tests
        run: node --test tests/*.test.cjs

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -15
          mkdir -p artifacts
          cp "$apk" artifacts/KlinikAI-debug.apk
          sha256sum artifacts/KlinikAI-debug.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlinikAI-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
