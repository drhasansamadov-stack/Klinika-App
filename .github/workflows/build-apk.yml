name: Build Klinik AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Klinik AI project
        run: |
          test -s KlinikAI_GitHub_Project_v0.3.zip
          unzip -oq KlinikAI_GitHub_Project_v0.3.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --version
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run offline logic tests
        run: node --test tests/*.test.cjs

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -15
          mkdir -p artifacts
          cp "$apk" artifacts/KlinikAI-debug.apk
          sha256sum artifacts/KlinikAI-debug.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlinikAI-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
